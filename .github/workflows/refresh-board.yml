name: Refresh prospect board

# The entire refresh runs INSIDE this runner: the prediction server is booted
# from the checked-out repo (models load from committed artifacts) and the
# builder grades every FBS player against 127.0.0.1 — production never sees a
# single /predict call. Budget: ~12,300 predicts at the builder's ~10 req/s
# ceiling ≈ 21 min, plus ~300 ESPN roster fetches and model warmup ≈ 25-40 min
# wall clock, comfortably inside the 120-min job timeout.
#
# Secrets (both optional — the job works with neither configured):
#   CFBD_API_KEY   enables the enrichment refresh step; without it the
#                  committed training_data/enrichment.json is used as-is.
#   FLY_API_TOKEN  enables the final auto-deploy to Fly.io; without it the
#                  refreshed board lands on main and ships on the next manual
#                  `fly deploy`.

on:
  schedule:
    # Tuesdays 09:00 UTC during the CFB season (Aug–Jan)
    - cron: "0 9 * 8-12,1 2"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start prediction server on 127.0.0.1:5001
        # No ANALYTICS_KEY / AUTH0_* / DATABASE_URL: analytics and auth stay
        # dormant and the player DB falls back to a scratch sqlite file.
        # AUTO_SYNC_COLLEGE_PROSPECTS=false skips the startup roster sync —
        # the builder supplies espn_ids per /predict call, so no seed needed.
        env:
          FLASK_ENV: production
          AUTO_SYNC_COLLEGE_PROSPECTS: "false"
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          gunicorn -w 4 -b 127.0.0.1:5001 --timeout 120 \
            --pid "$RUNNER_TEMP/gunicorn.pid" XGBOost:app \
            > "$RUNNER_TEMP/gunicorn.log" 2>&1 &
          echo "gunicorn launched (pid file: $RUNNER_TEMP/gunicorn.pid)"

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5001/health > /dev/null 2>&1; then
              echo "Server healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: server never became healthy — last 100 log lines:"
          tail -100 "$RUNNER_TEMP/gunicorn.log"
          exit 1

      - name: Refresh enrichment (optional — needs CFBD_API_KEY secret)
        # Best-effort: on any failure (or when the secret is absent) the
        # committed training_data/enrichment.json keeps serving the features.
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -z "${CFBD_API_KEY}" ]; then
            echo "CFBD_API_KEY secret not configured — skipping enrichment refresh."
            exit 0
          fi
          python scripts/build_enrichment.py

      - name: Rebuild board cache, history snapshot, and movers
        # 6 workers against localhost, paced by the builder's global ~10 req/s
        # ceiling (per-worker delay is redundant under the limiter → --delay 0).
        run: |
          python build_prospect_cache.py \
            --api-url http://127.0.0.1:5001 \
            --workers 6 \
            --delay 0

      - name: Generate weekly YouTube recap
        run: python scripts/generate_weekly_recap.py

      - name: Stop prediction server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/gunicorn.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/gunicorn.pid")" 2>/dev/null || true
          fi

      - name: Commit refreshed board back to main
        # No `if: always()` here on purpose: any failure above skips this step,
        # so a broken run commits NOTHING and the old board stays live.
        run: |
          git config user.name  "draftvision-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add training_data/prospect_cache.json \
                  training_data/board_history \
                  training_data/board_movers.json \
                  training_data/enrichment.json \
                  content/recaps
          if git diff --cached --quiet; then
            echo "Board unchanged — nothing to commit."
          else
            git commit -m "chore(board): weekly prospect board refresh [board-bot]"
            git push origin main
          fi

      - name: Deploy to Fly.io (optional — needs FLY_API_TOKEN secret)
        # Fly does NOT auto-deploy on push. With a deploy token configured
        # (`fly tokens create deploy -a draftvision` → repo secret
        # FLY_API_TOKEN) the fresh board goes live immediately; otherwise it
        # ships on the next manual `fly deploy`. Best-effort: a deploy hiccup
        # must not fail the (already committed) refresh.
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "FLY_API_TOKEN secret not configured — skipping deploy."
            echo "The new board ships on the next manual 'fly deploy'."
            exit 0
          fi
          curl -L https://fly.io/install.sh | sh
          "$HOME/.fly/bin/flyctl" deploy --remote-only
