name: Tests

# Runs the regression suite on every push and pull request. The suite is
# fixture-driven (saved Kalshi payloads under tests/fixtures) so it needs no
# network, no secrets and no model artifacts — a Kalshi schema drift or a
# parser regression fails here instead of silently on the live board.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Kalshi parsing + edge regression suite
        # DV_EDGE_NO_WARMUP keeps the market warm-thread and history capture
        # off so the run is hermetic (no outbound calls, no files written).
        env:
          DV_EDGE_NO_WARMUP: "1"
        run: python tests/test_edge_parsing.py
