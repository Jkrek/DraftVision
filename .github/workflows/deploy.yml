name: Deploy

# Ships main to Fly.io (draft.jkrek.com). Runs on demand, or automatically
# once the Tests workflow has passed on main — a broken regression suite can
# never deploy. Shares the refresh job's concurrency group so a deploy and a
# weekly board refresh queue instead of racing on the same app.

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: refresh-board
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install flyctl
        run: curl -L https://fly.io/install.sh | sh

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          "$HOME/.fly/bin/flyctl" deploy --remote-only
