<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAFAF7" />
    <!-- Theme boot — runs before any paint so there is no flash of the wrong
         theme. Order: saved choice ('dv_theme') → OS preference → light.
         Keep the colors in sync with --color-bg in src/nocturne.css. -->
    <script>
      (function () {
        var t = 'light';
        try {
          var saved = localStorage.getItem('dv_theme');
          if (saved === 'dark' || saved === 'light') {
            t = saved;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            t = 'dark';
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#232A36');
        }
      })();
    </script>
    <meta
      name="description"
      content="DraftVision — ML-Powered NFL Prospect Success Prediction. Browse college prospects and get instant AI scouting reports."
    />
    <meta property="og:title" content="DraftVision — Machine-learned draft intelligence" />
    <meta
      property="og:description"
      content="ML-powered NFL prospect success prediction. Browse college prospects and get instant AI scouting reports."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/brand/jk-icon-192.png" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/brand/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/brand/jk-icon-192.png" />
    <title>DraftVision — Machine-learned draft intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>

  </body>
</html>
