<!-- @dsCard group="Sections" name="Hero" subtitle="Landing hero — pill, gradient display, stat strip, CTAs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070d1b;--t1:#eef2ff;--t2:#94a3b8}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--t1);margin:0;-webkit-font-smoothing:antialiased}
.hero{position:relative;min-height:620px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5rem 1.5rem;overflow:hidden;isolation:isolate}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(99,102,241,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.04) 1px,transparent 1px);background-size:48px 48px;z-index:-2}
.hero::after{content:'';position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);width:720px;height:360px;background:radial-gradient(ellipse at center,rgba(99,102,241,.22) 0%,rgba(168,85,247,.1) 50%,transparent 72%);z-index:-1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;background:rgba(99,102,241,.13);border:1px solid rgba(99,102,241,.3);color:#a5b4fc;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:1.5rem}
.pill i{width:6px;height:6px;border-radius:50%;background:#6366f1;box-shadow:0 0 6px #6366f1;font-style:normal}
h1{font-size:clamp(56px,10vw,100px);font-weight:900;letter-spacing:-3px;line-height:.95;margin:0 0 1.4rem;background:linear-gradient(135deg,#c7d2fe 0%,#a78bfa 45%,#f472b6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 60px rgba(139,92,246,.3))}
.sub{font-size:1.15rem;color:rgba(238,242,255,.85);max-width:580px;margin:0 auto 2.4rem;line-height:1.6}
.stats{display:flex;justify-content:center;margin-bottom:2.6rem;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:center;padding:0 2rem;border-right:1px solid rgba(255,255,255,.08)}
.stat:last-child{border-right:none}
.v{font-size:1.7rem;font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.l{font-size:.72rem;color:rgba(148,163,184,.65);text-transform:uppercase;letter-spacing:.08em;font-weight:500;margin-top:5px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.primary{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;font-weight:700;font-size:.95rem;text-decoration:none;box-shadow:0 4px 20px rgba(99,102,241,.35);transition:all .2s}
.primary:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(99,102,241,.5)}
.secondary{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:10px;background:rgba(255,255,255,.06);color:rgba(238,242,255,.9);font-weight:600;font-size:.95rem;text-decoration:none;border:1.5px solid rgba(255,255,255,.14);transition:all .2s}
.secondary:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}
</style>
</head>
<body>
  <section class="hero">
    <span class="pill"><i></i>ML-graded 2026 draft class</span>
    <h1>Scout smarter.<br>Draft better.</h1>
    <p class="sub">Every FBS player graded by a machine-learning ensemble — draft projections, pro-success odds, and a big board that updates as the season unfolds.</p>
    <div class="stats">
      <div class="stat"><span class="v">9,033</span><span class="l">Players graded</span></div>
      <div class="stat"><span class="v">134</span><span class="l">FBS programs</span></div>
      <div class="stat"><span class="v">2</span><span class="l">ML models</span></div>
    </div>
    <div class="btns">
      <a class="primary" href="#">Explore the big board →</a>
      <a class="secondary" href="#">Build a mock draft</a>
    </div>
  </section>
</body>
</html>
